<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mc.github.io</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--text:#24292e;--muted:#6a737d}
    body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:var(--text); margin:0; padding:2rem;}
    .wrap{max-width:850px;margin:0 auto;background:var(--card);padding:2.5rem;border-radius:8px;box-shadow:0 6px 18px rgba(99,102,106,0.08)}
    h1,h2,h3{color:var(--text)}
    p{line-height:1.7;color:var(--muted)}
    pre{background:#0b1220;color:#e6edf3;padding:1rem;border-radius:6px;overflow:auto}
    code{background:#f3f4f6;padding:.2rem .4rem;border-radius:4px}
    a{color:#0366d6;text-decoration:none}
    .meta{font-size:.9rem;color:var(--muted);margin-bottom:1rem}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
</head>
<body>
  <div class="wrap">
    <div class="meta">渲染仓库根目录的 <code>README.md</code> —— 自动更新</div>
    <main id="content">正在加载 README.md …</main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script>
    // 安全提示: 这个简单示例不会做复杂的 XSS 过滤，请确保 README.md 的内容可信。
    fetch('/README.md')
      .then(function(resp){ if(!resp.ok) throw new Error('无法读取 README.md: ' + resp.status); return resp.text(); })
      .then(function(md){
        // 使用 marked 渲染 markdown
        document.getElementById('content').innerHTML = marked.parse(md);
        // 高亮代码块
        document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
      })
      .catch(function(err){
        document.getElementById('content').innerHTML = '<p>加载 README.md 失败：'+ err.message +'</p>';
      });
  </script>
</body>
</html>
