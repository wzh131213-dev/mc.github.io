name: Game integration checks

on:
  push:
    branches:
      - feature/rendering-lighting-shadows-materials
      - feature/vanilla-content-inventory-mobs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependency lockfile with safe patch releases
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency security
        run: npm audit --audit-level=low
      - name: Diagnose dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = process.env.RUNNER_TEMP + '/npm-audit.json'
          const report = JSON.parse(fs.readFileSync(file, 'utf8'))
          const entries = Object.entries(report.vulnerabilities || {})
          console.log('npm audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}))
          for (const [name, item] of entries) {
            const via = (item.via || []).map((v) => typeof v === 'string' ? v : { title: v.title, url: v.url, range: v.range })
            console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via }))
          }
          NODE
      - name: Inventory and world regression tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Verify generated page
        run: |
          test -s dist/index.html
          if grep -qE 'src="/main\\.tsx"|src="/main\\.jsx"' dist/index.html; then
            echo "Uncompiled TypeScript entry found"
            exit 1
          fi
          echo "Game integration build verified"
      - name: Commit refreshed dependency lockfile
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited dependency lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
