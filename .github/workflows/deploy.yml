name: Build and deploy Minecraft web app

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/unzip-upload.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Vite application
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          if grep -qE 'src="/main\.tsx"|src="/main\.jsx"' dist/index.html; then
            echo "Uncompiled TSX entry found in dist/index.html"
            exit 1
          fi
          echo "Vite output verified:"
          ls -lah dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
